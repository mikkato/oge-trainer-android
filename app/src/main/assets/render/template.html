<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
    :root {
        --fg: #F2F4F7;
        --muted: #AEB8C6;
        --accent: #FF6B5C;
        --code-bg: #262D3B;
        --border: #384052;
    }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
        color: var(--fg);
        font: 16px/1.65 -apple-system, "Segoe UI", Roboto, sans-serif;
        word-wrap: break-word;
        overflow-wrap: anywhere;
    }
    p { margin: 0.45em 0; }
    h1, h2, h3, h4 { margin: 0.9em 0 0.4em; line-height: 1.3; }
    h1 { font-size: 1.25em; }
    h2 { font-size: 1.12em; }
    h3 { font-size: 1.02em; }
    ul, ol { margin: 0.45em 0; padding-left: 1.35em; }
    li { margin: 0.2em 0; }
    strong, b { color: var(--fg); font-weight: 600; }
    code { background: var(--code-bg); padding: 0.08em 0.32em; border-radius: 5px; font-size: 0.92em; }
    pre { background: var(--code-bg); padding: 0.7em; border-radius: 8px; overflow-x: auto; }
    pre code { background: transparent; padding: 0; }
    blockquote { margin: 0.5em 0; padding-left: 0.8em; border-left: 2px solid var(--border); color: var(--muted); }
    table { border-collapse: collapse; width: 100%; font-size: 0.94em; }
    th, td { border-bottom: 1px solid var(--border); padding: 0.35em 0.45em; text-align: left; }
    .katex { font-size: 1.08em; }
    .katex-display { margin: 0.55em 0; overflow-x: auto; overflow-y: hidden; padding: 0.12em 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="katex/katex.min.js"></script>
<script src="katex/contrib/auto-render.min.js"></script>
<script src="marked.min.js"></script>
<script>
    function normalizeMath(text) {
        // \( ... \) -> $...$,  \[ ... \] -> $$...$$ (как в web-версии, Markdown.tsx)
        return text
            .replace(/\\\[([\s\S]*?)\\\]/g, function (_, m) { return '\n$$' + m.trim() + '$$\n'; })
            .replace(/\\\(([\s\S]*?)\\\)/g, function (_, m) { return '$' + m.trim() + '$'; });
    }

    function reportHeight() {
        var root = document.getElementById('root');
        var h = Math.max(root.scrollHeight, Math.ceil(root.getBoundingClientRect().height));
        if (window.console) console.log('height=' + h + ' scrollH=' + root.scrollHeight + ' rect=' + Math.round(root.getBoundingClientRect().height)
            + ' innerW=' + window.innerWidth + ' clientW=' + document.documentElement.clientWidth
            + ' rootW=' + Math.round(root.getBoundingClientRect().width) + ' scrollW=' + root.scrollWidth);
        if (window.Android && window.Android.onHeight) {
            // Целое число: JS-мост не приводит float к Int и падает с "Java exception was raised".
            window.Android.onHeight(Math.round(h) + 2);
        }
    }

    var ready = false;
    var pending = null;

    function renderMarkdown(md) {
        if (!ready) { pending = md; return; }
        var root = document.getElementById('root');
        try {
            root.innerHTML = marked.parse(normalizeMath(md || ''), { breaks: true, gfm: true });
            if (window.renderMathInElement) {
                renderMathInElement(root, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false,
                    strict: false
                });
            }
        } catch (e) {
            root.textContent = String(md || '');
        }
        reportHeight();
    }

    window.renderMarkdown = renderMarkdown;

    function bootstrap() {
        ready = true;
        if (pending !== null) {
            renderMarkdown(pending);
            pending = null;
        }
        reportHeight();
    }

    // Высота меняется после подстановки шрифтов KaTeX и пересчёта формул: без наблюдателя
    // карточка остаётся обрезанной на первой строке.
    if (window.ResizeObserver) {
        new ResizeObserver(function () { reportHeight(); }).observe(document.getElementById('root'));
    }
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { reportHeight(); });
    }

    document.addEventListener('DOMContentLoaded', function () { reportHeight(); });
    window.addEventListener('load', function () {
        bootstrap();
        setTimeout(reportHeight, 60);
        setTimeout(reportHeight, 250);
        setTimeout(reportHeight, 600);
    });
    window.addEventListener('resize', reportHeight);
</script>
</body>
</html>
