<svg viewBox="0 0 640 360" width="100%" xmlns="http://www.w3.org/2000/svg">
<rect width="640" height="360" fill="#161920"/>
<rect x="60" y="140" width="150" height="70" rx="8" fill="#3a1f24" stroke="#ff6b5c" stroke-width="2"/>
<text x="135" y="180" fill="#ff6b5c" font-size="20" font-family="Arial, sans-serif" text-anchor="middle">нагреватель</text>
<text x="135" y="160" fill="#ff6b5c" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">T₁ (горячий)</text>
<rect x="300" y="140" width="140" height="70" rx="8" fill="#1f2a3a" stroke="#e6e8ec" stroke-width="2"/>
<text x="370" y="180" fill="#e6e8ec" font-size="20" font-family="Arial, sans-serif" text-anchor="middle">двигатель</text>
<rect x="520" y="140" width="150" height="70" rx="8" fill="#1a2a3a" stroke="#4a90d9" stroke-width="2"/>
<text x="595" y="180" fill="#4a90d9" font-size="20" font-family="Arial, sans-serif" text-anchor="middle">холодильник</text>
<text x="595" y="160" fill="#4a90d9" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">T₂ (холодный)</text>
<line x1="210" y1="165" x2="300" y2="165" stroke="#ff6b5c" stroke-width="3" marker-end="url(#b)"/>
<text x="255" y="152" fill="#ff6b5c" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">Q₁</text>
<line x1="440" y1="165" x2="520" y2="165" stroke="#4a90d9" stroke-width="3" marker-end="url(#c)"/>
<text x="480" y="152" fill="#4a90d9" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">Q₂</text>
<line x1="370" y1="210" x2="370" y2="270" stroke="#7ce38b" stroke-width="3" marker-end="url(#d)"/>
<text x="390" y="245" fill="#7ce38b" font-size="18" font-family="Arial, sans-serif">A (работа)</text>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff6b5c"/></marker><marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4a90d9"/></marker><marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7ce38b"/></marker></defs>
<text x="320" y="320" fill="#aeb8c6" font-size="16" font-family="Arial, sans-serif" text-anchor="middle">КПД = A / Q₁</text>
</svg>