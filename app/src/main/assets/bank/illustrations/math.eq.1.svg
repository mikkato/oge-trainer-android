<svg viewBox="0 0 640 360" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="360" fill="#161920"/><text x="160" y="36" fill="#e6e8ec" font-size="16" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">Линейное ax + b = 0</text><line x1="40" y1="160" x2="280" y2="160" stroke="#e6e8ec" stroke-width="2"/><polygon points="280,160 268,153 268,167" fill="#e6e8ec"/><line x1="160" y1="270" x2="160" y2="50" stroke="#e6e8ec" stroke-width="2"/><polygon points="160,50 153,62 167,62" fill="#e6e8ec"/><line x1="40" y1="280" x2="280" y2="40" stroke="#ff6b5c" stroke-width="3"/><circle cx="160" cy="160" r="6" fill="#ff6b5c"/><text x="175" y="150" fill="#ff6b5c" font-size="17" font-family="Arial, sans-serif">x₀</text><text x="160" y="302" fill="#aeb8c6" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">один корень x₀ = −b/a</text><text x="480" y="36" fill="#e6e8ec" font-size="16" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">Квадратное ax² + bx + c = 0</text><line x1="360" y1="160" x2="600" y2="160" stroke="#e6e8ec" stroke-width="2"/><polygon points="600,160 588,153 588,167" fill="#e6e8ec"/><line x1="480" y1="270" x2="480" y2="50" stroke="#e6e8ec" stroke-width="2"/><polygon points="480,50 473,62 487,62" fill="#e6e8ec"/><polyline points="360,60 400,160 440,220 480,240 520,220 560,160 600,60" fill="none" stroke="#ff6b5c" stroke-width="3"/><circle cx="400" cy="160" r="6" fill="#ff6b5c"/><circle cx="560" cy="160" r="6" fill="#ff6b5c"/><text x="395" y="150" fill="#ff6b5c" font-size="17" font-family="Arial, sans-serif" text-anchor="end">x₁</text><text x="565" y="150" fill="#ff6b5c" font-size="17" font-family="Arial, sans-serif">x₂</text><text x="480" y="302" fill="#aeb8c6" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">до двух корней · D = b² − 4ac</text></svg>
