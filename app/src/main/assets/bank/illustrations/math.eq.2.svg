<svg viewBox="0 0 640 360" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="360" fill="#161920"/><text x="320" y="48" fill="#e6e8ec" font-size="19" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">Задача на движение навстречу</text><line x1="80" y1="180" x2="560" y2="180" stroke="#e6e8ec" stroke-width="2"/><circle cx="80" cy="180" r="5" fill="#e6e8ec"/><circle cx="560" cy="180" r="5" fill="#e6e8ec"/><text x="80" y="160" fill="#e6e8ec" font-size="20" font-family="Arial, sans-serif" text-anchor="middle">A</text><text x="560" y="160" fill="#e6e8ec" font-size="20" font-family="Arial, sans-serif" text-anchor="middle">B</text><line x1="100" y1="150" x2="260" y2="150" stroke="#ff6b5c" stroke-width="2"/><polygon points="260,150 248,143 248,157" fill="#ff6b5c"/><text x="180" y="135" fill="#ff6b5c" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">v₁</text><line x1="540" y1="150" x2="380" y2="150" stroke="#ff6b5c" stroke-width="2"/><polygon points="380,150 392,143 392,157" fill="#ff6b5c"/><text x="460" y="135" fill="#ff6b5c" font-size="18" font-family="Arial, sans-serif" text-anchor="middle">v₂</text><circle cx="320" cy="180" r="6" fill="#ff6b5c"/><text x="320" y="215" fill="#ff6b5c" font-size="16" font-family="Arial, sans-serif" text-anchor="middle">место встречи</text><text x="320" y="252" fill="#aeb8c6" font-size="15" font-family="Arial, sans-serif" text-anchor="middle">S — расстояние между A и B</text><text x="320" y="320" fill="#e6e8ec" font-size="21" font-family="Arial, sans-serif" text-anchor="middle">время до встречи:  t = S / (v₁ + v₂)</text></svg>
