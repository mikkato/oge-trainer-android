<svg viewBox="0 0 640 360" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="360" fill="#161920"/><text x="24" y="30" fill="#e6e8ec" font-size="19" font-family="Arial, sans-serif" font-weight="bold">Взаимодействие природы и общества</text><circle cx="200" cy="190" r="72" fill="#2e3440" stroke="#e6e8ec" stroke-width="2"/><circle cx="440" cy="190" r="72" fill="#2e3440" stroke="#e6e8ec" stroke-width="2"/><text x="200" y="196" fill="#e6e8ec" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">Природа</text><text x="440" y="196" fill="#e6e8ec" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">Общество</text><line x1="256" y1="156" x2="384" y2="156" stroke="#7ad15c" stroke-width="2"/><polygon points="384,156 372,149 372,163" fill="#7ad15c"/><text x="320" y="142" fill="#7ad15c" font-size="16" font-family="Arial, sans-serif" text-anchor="middle">природные ресурсы</text><line x1="384" y1="224" x2="256" y2="224" stroke="#ff6b5c" stroke-width="2"/><polygon points="256,224 268,217 268,231" fill="#ff6b5c"/><text x="320" y="242" fill="#ff6b5c" font-size="16" font-family="Arial, sans-serif" text-anchor="middle">отходы и загрязнение</text><text x="320" y="322" fill="#aeb8c6" font-size="15" font-family="Arial, sans-serif" text-anchor="middle">природа даёт ресурсы, общество влияет на природу</text></svg>
