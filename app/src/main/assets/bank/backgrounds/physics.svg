<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#1b1426"/>
    </linearGradient>
    <filter id="b" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <g filter="url(#b)">
<text x="42" y="342" font-size="51" fill="#557a8a" opacity="0.1" font-family="Georgia, 'Times New Roman', serif" transform="rotate(-9 42 342)">E = mc²</text>
<text x="710" y="704" font-size="69" fill="#6b7280" opacity="0.12" font-family="Georgia, 'Times New Roman', serif" transform="rotate(-19 710 704)">F = ma</text>
<text x="639" y="273" font-size="33" fill="#6b7280" opacity="0.15" font-family="Georgia, 'Times New Roman', serif" transform="rotate(9 639 273)">U = IR</text>
<text x="1447" y="691" font-size="22" fill="#5a6f9e" opacity="0.17" font-family="Georgia, 'Times New Roman', serif" transform="rotate(-20 1447 691)">P = UI</text>
<text x="387" y="176" font-size="26" fill="#557a8a" opacity="0.09" font-family="Georgia, 'Times New Roman', serif" transform="rotate(12 387 176)">v = s/t</text>
<text x="1177" y="352" font-size="77" fill="#4f7d8f" opacity="0.1" font-family="Georgia, 'Times New Roman', serif" transform="rotate(16 1177 352)">a = Δv/Δt</text>
<text x="246" y="890" font-size="32" fill="#5b7a9e" opacity="0.16" font-family="Georgia, 'Times New Roman', serif" transform="rotate(5 246 890)">F = G·m₁m₂/r²</text>
<text x="903" y="790" font-size="30" fill="#5b7a9e" opacity="0.09" font-family="Georgia, 'Times New Roman', serif" transform="rotate(-2 903 790)">E = hν</text>
