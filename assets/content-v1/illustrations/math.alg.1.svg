<svg viewBox="0 0 640 360" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="360" fill="#161920"/><rect x="140" y="70" width="360" height="240" fill="#2e3440" stroke="#e6e8ec" stroke-width="2"/><line x1="380" y1="70" x2="380" y2="310" stroke="#e6e8ec" stroke-width="2"/><line x1="140" y1="210" x2="500" y2="210" stroke="#e6e8ec" stroke-width="2"/><rect x="140" y="70" width="240" height="140" fill="#2e3440"/><rect x="380" y="210" width="120" height="100" fill="#2e3440"/><rect x="380" y="70" width="120" height="140" fill="#ff6b5c" fill-opacity="0.30"/><rect x="140" y="210" width="240" height="100" fill="#ff6b5c" fill-opacity="0.30"/><text x="260" y="152" fill="#e6e8ec" font-size="30" font-family="Arial, sans-serif" text-anchor="middle">a²</text><text x="440" y="152" fill="#ff6b5c" font-size="26" font-family="Arial, sans-serif" text-anchor="middle">ab</text><text x="260" y="270" fill="#ff6b5c" font-size="26" font-family="Arial, sans-serif" text-anchor="middle">ab</text><text x="440" y="270" fill="#e6e8ec" font-size="30" font-family="Arial, sans-serif" text-anchor="middle">b²</text><text x="260" y="54" fill="#e6e8ec" font-size="22" font-family="Arial, sans-serif" text-anchor="middle">a</text><text x="440" y="54" fill="#e6e8ec" font-size="22" font-family="Arial, sans-serif" text-anchor="middle">b</text><text x="122" y="148" fill="#e6e8ec" font-size="22" font-family="Arial, sans-serif" text-anchor="middle">a</text><text x="122" y="266" fill="#e6e8ec" font-size="22" font-family="Arial, sans-serif" text-anchor="middle">b</text><text x="320" y="348" fill="#e6e8ec" font-size="21" font-family="Arial, sans-serif" text-anchor="middle">(a + b)² = a² + <tspan fill="#ff6b5c">2ab</tspan> + b²</text></svg>
