name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка наличия Gradle-проекта
        id: guard
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::Gradle-проект ещё не добавлен в репозиторий (этап P0-1 плана). Сборка APK недоступна."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Восстановление keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Сборка подписанного APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK" || { echo "::error::APK не найден"; exit 1; }
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Имя файла, хеш, релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="oge-trainer-${VERSION}.apk"
          cp "$APK_PATH" "$OUT"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "SHA256: $SHA"
          printf 'sha256  %s\n' "$SHA" > "$OUT.sha256"
          gh release create "$GITHUB_REF_NAME" "$OUT" "$OUT.sha256" \
            --title "Oge Trainer ${VERSION}" \
            --notes "Сборка из тега ${GITHUB_REF_NAME}.

          Установка: скачать APK, разрешить установку из неизвестного источника.
          sha256: \`${SHA}\`
          Отпечаток сертификата: см. README."
